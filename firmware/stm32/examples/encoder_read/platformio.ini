[platformio]
default_envs = g431_as5600_usb
lib_dir = ../../lib

[env]
; Core 3.0 breaks SimpleFOC 2.4.0's STM32 timer API. Pin the compatible core.
platform = ststm32@20.0.0
platform_packages = platformio/framework-arduinoststm32@4.21200.0
board = genericSTM32G431CBT6
framework = arduino
lib_deps = askuric/Simple FOC@2.4.0
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
build_flags = -Wall -Wextra

[env:g431_as5600_usb]
build_flags =
    ${env.build_flags}
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC

[env:g431_as5600_uart]

; Read-only dual PWM diagnostics: PA0/TIM2 + PB7/TIM4; both motor EN pins LOW.
[env:g431_dual_encoder]
build_src_filter = -<*> +<clock.cpp> +<dual_encoder_main.cpp> +<pwm_input.cpp> +<pwm_input_secondary.cpp>
build_flags =
    ${env.build_flags}
    -DDUAL_ENCODER_DIAGNOSTIC

; Dedicated EN pin control only. No motor PWM. Boots LOW; explicit ON expires
; after 5s. User chose direct PB5 wiring despite disclosed board R78 load.
[env:g431_enable_uart]
build_flags =
    ${env.build_flags}
    -DENABLE_PIN_CONTROL
    -DHAL_IWDG_MODULE_ENABLED

; Numbered, explicitly triggered open-loop jog with PB5 hardware enable.
; Boots disabled. Every run needs a new increasing MOTOR id; each is <=~3s.
[env:g431_motor_gpio]
lib_archive = no
build_src_filter = +<*> -<main.cpp> -<motor_jog.cpp>
build_flags =
    ${env.build_flags}
    -DMOTOR_GPIO_CONTROL
    -DENABLE_PIN_CONTROL
    -DHAL_IWDG_MODULE_ENABLED

; Separate manual-enable bench test. EN must be disconnected from PB5 and
; supplied externally. Keep 12V OFF through flashing/startup verification.
; No motion on boot: one explicit UART JOG, 1V / 0.5rad/s / <=3s per boot.
[env:g431_motor_jog]
; Ensure STM32's strong PWM backend overrides generic weak analogWrite symbols.
; Archive extraction otherwise selects generic_mcu first and silently gives 1kHz.
lib_archive = no
build_src_filter = +<*> -<main.cpp>
build_flags =
    ${env.build_flags}
    -DMOTOR_BENCH_JOG
    -DHAL_IWDG_MODULE_ENABLED

; Bench diagnostic only: disconnect the encoder OUT and motor driver first.
; PA8 outputs 250 Hz / 50% duty. Jumper PA8 to PA0 to test the capture path.
[env:g431_pwm_loopback]
build_flags =
    ${env.build_flags}
    -DENCODER_PWM_LOOPBACK

; Sensor-commutated closed-loop demo, separate from accepted open-loop jog.
; Boot OFF and uncalibrated; nonblocking calibration and a 1500ms owner lease.
[env:g431_closed_loop]
lib_archive = no
build_src_filter = +<*> -<main.cpp> -<motor_gpio.cpp> -<motor_jog.cpp>
build_flags =
    ${env.build_flags}
    ; Retain SWD variable/type information with the normal optimization level.
    -g3
    -DCLOSED_LOOP_CONTROL
    -DHAL_IWDG_MODULE_ENABLED
    -DFOC_DEBUG_TRACE
    -DSERIAL_TX_BUFFER_SIZE=256

; Same controller per motor, independent command IDs/calibration/lease.
[env:g431_dual_motor]
extends = env:g431_closed_loop
build_flags =
    ${env:g431_closed_loop.build_flags}
    -DDUAL_MOTOR_CONTROL
    -DSERIAL_RX_BUFFER_SIZE=256
